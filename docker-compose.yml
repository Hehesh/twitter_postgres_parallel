services:
  pg_denormalized:
    build:
      context: ./services/pg_denormalized
    volumes:
      - ./:/tmp/db
      - pg_denormalized:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      PGUSER: postgres
    ports:
      - "1380:5432"

  pg_normalized:
    build:
      context: ./services/pg_normalized
    volumes:
      - ./:/tmp/db
      - pg_normalized:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      PGUSER: postgres
    ports:
      - "8310:5432"

  pg_normalized_batch:
    build:
      context: ./services/pg_normalized_batch
    volumes:
      - ./:/tmp/db
      - pg_normalized_batch:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      PGUSER: postgres
    ports:
      - "3810:5432"

volumes:
  pg_denormalized:
  pg_normalized:
  pg_normalized_batch:
